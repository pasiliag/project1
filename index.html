<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Desk</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #657084;
      --line: #d8dee8;
      --paper: #f7f2ea;
      --panel: #ffffff;
      --blue: #2563eb;
      --green: #0f9f6e;
      --amber: #d97706;
      --rose: #e11d48;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.10), transparent 34%),
        linear-gradient(225deg, rgba(15, 159, 110, 0.12), transparent 30%),
        var(--paper);
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: #111827;
      font-weight: 800;
      box-shadow: 0 14px 34px rgba(17, 24, 39, 0.18);
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .date {
      color: var(--muted);
      margin-top: 4px;
      font-size: 14px;
    }

    .primary-action {
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.26);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(216, 222, 232, 0.9);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(31, 41, 55, 0.10);
    }

    .hero {
      padding: 28px;
      min-height: 330px;
      display: grid;
      align-content: space-between;
      background:
        linear-gradient(rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.90)),
        url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1400&q=80");
      background-size: cover;
      background-position: center;
    }

    .hero h2 {
      max-width: 640px;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 560px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .stat {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
    }

    .stat strong {
      display: block;
      font-size: 28px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .card {
      padding: 22px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 20px;
      line-height: 1.2;
    }

    .chip {
      border-radius: 999px;
      padding: 6px 10px;
      color: #075985;
      background: #e0f2fe;
      font-size: 12px;
      font-weight: 700;
    }

    .tasks {
      display: grid;
      gap: 10px;
    }

    .task {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
    }

    .task:nth-child(2) .dot {
      background: var(--amber);
    }

    .task:nth-child(3) .dot {
      background: var(--rose);
    }

    .task span {
      min-width: 0;
      font-weight: 650;
    }

    .task time {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 13px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .icon-button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #111827;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 820px) {
      header,
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
      }

      .primary-action {
        width: 100%;
      }

      .grid {
        display: grid;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: min(100% - 20px, 1180px);
        padding: 18px 0;
      }

      .hero,
      .card {
        padding: 18px;
      }

      .composer {
        grid-template-columns: 1fr;
      }

      .icon-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">FD</div>
        <div>
          <h1>Focus Desk</h1>
          <p class="date">今天的节奏，清楚一点就好。</p>
        </div>
      </div>
      <button class="primary-action" type="button">开始专注</button>
    </header>

    <section class="grid">
      <article class="panel hero">
        <div>
          <h2>把今天拆成几件能完成的小事。</h2>
          <p>一个安静的工作台界面，适合放任务、记进度、看状态。没有复杂功能，只给你一个干净的开始。</p>
        </div>

        <div class="stats">
          <div class="stat">
            <strong>3</strong>
            <span>进行中的任务</span>
          </div>
          <div class="stat">
            <strong>72%</strong>
            <span>今日完成度</span>
          </div>
          <div class="stat">
            <strong>45m</strong>
            <span>下一段专注</span>
          </div>
        </div>
      </article>

      <div class="side">
        <article class="panel card">
          <div class="card-head">
            <h2>今日清单</h2>
            <span class="chip">实时</span>
          </div>

          <div class="tasks">
            <div class="task">
              <i class="dot"></i>
              <span>整理项目结构</span>
              <time>09:30</time>
            </div>
            <div class="task">
              <i class="dot"></i>
              <span>完成首页视觉稿</span>
              <time>11:00</time>
            </div>
            <div class="task">
              <i class="dot"></i>
              <span>检查响应式布局</span>
              <time>16:20</time>
            </div>
          </div>
        </article>

        <article class="panel card">
          <div class="card-head">
            <h2>快速记录</h2>
            <span class="chip">草稿</span>
          </div>
          <div class="composer">
            <input type="text" placeholder="写下一件小事">
            <button class="icon-button" type="button" aria-label="添加">+</button>
          </div>
        </article>
      </div>
    </section>

    <footer>Made with plain HTML and CSS.</footer>
  </main>
</body>
</html>
